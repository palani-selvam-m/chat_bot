[project]
name = "lexichat"
version = "0.1.1"
description = "A multilingual RAG chatbot for legal documents"
requires-python = ">=3.9"

dependencies = [
  "streamlit",
  "pymupdf",
  "minio",
  "sentence-transformers",
  "langchain",
  "transformers",
  "torch",
  "python-dotenv",
  "tqdm",
  "langchain-core",
  "langchain-nvidia-ai-endpoints",
  "langchain-community",
  "faiss-cpu"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "app"]